name: shiry_kids_app
description: Shiry Kids - Fun children's e-commerce app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^13.0.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
